[lint]
select = [
    "E4",  # Import and indentation errors.
    "E7",  # Statement errors.
    "E9",  # Runtime and syntax errors.
    "F",   # Pyflakes defects.
    "B",   # Likely bugs.
    "RET", # Return-value defects.
]

[lint.per-file-ignores]
"Save*/**.py" = [
    "E711",  # The game runtime requires equality comparisons with None.
]

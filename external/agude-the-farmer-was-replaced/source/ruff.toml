target-version = "py310"
line-length = 100
extend-exclude = ["**/__builtins__.py"]

# The game injects these names without Python imports. The generated list keeps
# Ruff's undefined-name checking while accepting the installed game API.
# game-api: start
# Generated by scripts/sync_game_api.py; do not edit this block.

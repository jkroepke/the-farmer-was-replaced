name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          cache-dependency-glob: justfile
      - uses: extractions/setup-just@v4
      - name: Install tools
        run: just sync
      - name: Run repository checks
        run: just check
